# A network of independent P&C agencies. Carriers pay commission to the network, which keeps a
# share and pays each agency its split. Every name, rate and amount here is invented.
id: agency-network
name: Agency Network (synthetic)
lineToleranceCents: 1

# The size of the network this demo is modeled on, from AAI's public pages, for the admin's "at this
# size" panel. Sizes only: nothing here estimates how often carriers pay wrong.
scale:
  name: AAI
  counterparties: 50
  bonusPrograms: 20
  source: AAI's public site, October 2026

carriers:
  - id: northwind
    name: Northwind Mutual
    format: northwind-csv
  - id: bluestem
    name: Bluestem Insurance Co.
    format: bluestem-csv
  - id: harbor-pine
    name: Harbor & Pine Casualty
    format: harbor-pine-pdf
